# Minimal IoTDB system config for local runs
# Only override the TsBlock row limit here; others use defaults.

# The max number of lines in a single TsBlock
max_tsblock_line_number=5

# Optionally raise byte cap so rows, not bytes, cut the block
 max_tsblock_size_in_bytes=150

query_timeout_threshold =3600000

degree_of_query_parallelism=1


dn_metric_reporter_list=PROMETHEUS
dn_metric_level=CORE
dn_metric_prometheus_reporter_port=9501
